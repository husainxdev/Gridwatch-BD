name: Checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gridwatch_test
          POSTGRES_USER: gridwatch
          POSTGRES_PASSWORD: ci_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridwatch -d gridwatch_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://gridwatch:ci_local_password@127.0.0.1:5432/gridwatch_test
      JWT_SECRET: ci_local_secret_for_automated_tests_only_32_chars
      APP_ENV: test
      DEMO_ENABLED: 'true'
      SMTP_HOST: 127.0.0.1
      FRONTEND_URL: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run ruff format --check app tests alembic ../scripts
      - run: uv run pytest -q
      - run: uv run alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
