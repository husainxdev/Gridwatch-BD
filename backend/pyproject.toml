[project]
name = "gridwatch-bd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "bcrypt>=4.2,<5", "email-validator>=2.2,<3"]
[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.13,<1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
